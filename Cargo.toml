[package]
name = "myhomelib"
version = "0.1.0"
edition = "2021"
description = "MyHomeLib — home e-book library manager (Rust rewrite of the FreePascal/Lazarus original)"
license = "MIT"

# Windowed GUI binary — only built when the `gui` feature is enabled (`cargo build --features gui`).
[[bin]]
name = "myhomelib-gui"
path = "src/bin/gui.rs"
required-features = ["gui"]

[dependencies]
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
egui = "0.31"
# Legacy FB2 encodings (windows-1251 / koi8-r / utf-16) -> UTF-8 before XML parsing.
encoding_rs = "0.8"
eframe = { version = "0.31", optional = true }
quick-xml = "0.42.0"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking"] }
rusqlite = { version = "0.31", features = ["functions", "collation"] }
rfd = { version = "0.15", optional = true }
# PNG decoding for the bundled toolbar icons (pure Rust, PNG-only — no native deps). gui-only.
image = { version = "0.25", optional = true, default-features = false, features = ["png"] }
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zip = "9.8.1"

[dev-dependencies]
tempfile = "3"

[features]
# Default: compile SQLite from source (libsqlite3-sys "bundled") so the release build is a single
# self-contained binary with no system dependency — required for the Windows 10 target.
# On dev machines without a C compiler you can build/test against the OS SQLite instead:
#   cargo test --no-default-features
default = ["bundled"]
bundled = ["rusqlite/bundled"]
# Windowed eframe GUI (pulls winit/GL). The pure-egui view + state logic and its headless tests build
# without this; only the native window runner needs it. Off by default so `cargo build`/`cargo test`
# work on headless machines and the CLI stays dependency-light.
gui = ["dep:eframe", "dep:rfd", "dep:image"]

[profile.release]
# Single self-contained Windows .exe is the end goal; keep it lean.
lto = true
codegen-units = 1
strip = true
panic = "abort"
