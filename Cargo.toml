[package]
name = "myhomelib"
version = "0.1.0"
edition = "2021"
description = "MyHomeLib — home e-book library manager (Rust rewrite of the FreePascal/Lazarus original)"
license = "MIT"

# Phase 1: data layer (core types + SQLite DAO). GUI/FB2/import/Librusec land in later phases.
[dependencies]
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
quick-xml = "0.42.0"
rusqlite = { version = "0.31", features = ["functions", "collation"] }
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zip = "9.8.1"

[dev-dependencies]
tempfile = "3"

[features]
# Default: compile SQLite from source (libsqlite3-sys "bundled") so the release build is a single
# self-contained binary with no system dependency — required for the Windows 10 target.
# On dev machines without a C compiler you can build/test against the OS SQLite instead:
#   cargo test --no-default-features
default = ["bundled"]
bundled = ["rusqlite/bundled"]

[profile.release]
# Single self-contained Windows .exe is the end goal; keep it lean.
lto = true
codegen-units = 1
strip = true
panic = "abort"
