name: Windows build

on:
  # Build + publish a versioned Windows release when a new tag is cut (tags point at commits on main).
  # `workflow_dispatch` stays for manual test runs.
  push:
    tags: ['*'] # any new tag; narrow to e.g. ['v[0-9]+.*'] if you only want version tags
  workflow_dispatch: {}

jobs:
  build-windows:
    runs-on: windows-latest
    # Creating/updating the release + uploading assets needs Contents:write; grant it to this workflow's
    # token (scoped to this workflow only — doesn't change the repo-wide default).
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (stable)
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Cache cargo + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: win-cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}

      # One build produces both binaries (the `gui` feature enables eframe and the GUI bin).
      - name: Build (release, CLI + GUI)
        run: cargo build --release --features gui

      - name: Collect binaries (named by the triggering tag)
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/myhomelib-gui.exe "dist/myhomelib-gui-$env:TAG.exe"
          Copy-Item target/release/myhomelib.exe "dist/myhomelib-$env:TAG.exe"
          Get-ChildItem dist | Format-Table Name, @{N='KB';E={[math]::Round($_.Length/1KB)}}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: myhomelib-windows-x86_64
          path: dist/*.exe
          if-no-files-found: error

      # One release per tag -> a stable, versioned download URL (myhomelib-gui-<tag>.exe). Only tag pushes
      # publish; a manual workflow_dispatch builds + uploads artifacts without creating a release.
      - name: Publish to GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Windows x86_64 (${{ github.ref_name }})
          files: |
            dist/*.exe
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
        # Prefer a dedicated Contents:write token (RELEASE_TOKEN secret) if one is set — useful when an
        # org policy blocks the `permissions` escalation above; otherwise the workflow's GITHUB_TOKEN.
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
